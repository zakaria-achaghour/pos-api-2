version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pos-service-api
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www:cached  # <-- cached mode here
      - /var/www/node_modules  # <-- Isolate node_modules
    depends_on:
      - postgres
    networks:
      - pos_service_api_network
      # - shared-service-network

  nginx:
    image: nginx:latest
    container_name: pos-service-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./public:/var/www/public  # Only mount public assets
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - pos_service_api_network
      # - shared-service-network

  postgres:
    image: postgres:15-alpine
    container_name: pos-service-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pos_service
      POSTGRES_USER: pos_user
      POSTGRES_PASSWORD: pos_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - pos_service_api_network

volumes:
  postgres_data:

networks:
  pos_service_api_network:
    driver: bridge
  # shared-service-network:
  #   external: true